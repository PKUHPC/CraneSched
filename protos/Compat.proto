syntax = "proto3";

package crane.grpc;
option go_package = "CraneFrontEnd/generated/protos";

import "google/protobuf/timestamp.proto";
import "PublicDefs.proto";

// Read-only query messages for compatibility clients. Native records live in
// PublicDefs.proto; RPCs reuse the authenticated CraneCtld service.
message QuerySinfoInfoRequest {
  uint32 uid = 1;
  bool reservations_only = 2;
}

message SinfoNodeInfo {
  CranedInfo node = 1;
  // Configured resource/type order and device order; protobuf maps lose both.
  repeated SinfoGresResource gres_order = 2;
  // Resources still held by ending allocations, included in node.res_alloc.
  ResourceInNodeV3 cleanup_resources = 3;
  // This node still owns unfinished work in an ending allocation.
  bool cleanup_pending = 4;
  // Exact holdings for subtraction: native node.res_alloc CPU counts are
  // rounded for display. cleanup_resources also retains exact CPU precision.
  optional double allocated_cpus = 5;
}

message SinfoGresResource {
  string name = 1;
  string type = 2;
  repeated string devices = 3;
}

message SinfoPartitionInfo {
  PartitionInfo partition = 1;
  bool is_default = 2;
  uint32 priority_job_factor = 3;
  PreemptMode preempt_mode = 4;
}

message QuerySinfoInfoReply {
  string cluster_name = 1;
  repeated SinfoNodeInfo nodes = 2;
  // Declaration order is significant for clients' default sorting.
  repeated SinfoPartitionInfo partitions = 3;
  repeated ReservationInfo reservations = 4;
  // Controller observation time for evaluating reservation intervals.
  google.protobuf.Timestamp observed_at = 5;
}
