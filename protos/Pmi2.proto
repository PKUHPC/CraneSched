syntax = "proto3";

package crane.grpc.pmi2;

// These messages are supervisor-to-supervisor control traffic. Application
// ranks use standard PMI-1.1 or PMI-2 socket protocols, not this transport.
message FenceRequest {
  uint32 job_id = 1;
  uint32 step_id = 2;
  uint64 epoch = 3;
  string craned_id = 4;
  map<string, string> kvs = 5;
  // 1 and 2 identify the PMI wire protocol negotiated by clients on this
  // step. Zero remains valid for requests from older CraneSched versions.
  uint32 pmi_version = 6;
}

message FenceReply {
  bool ok = 1;
  map<string, string> kvs = 2;
}

message AbortRequest {
  uint32 job_id = 1;
  uint32 step_id = 2;
  string craned_id = 3;
}

message AbortReply {
  bool ok = 1;
}

service Pmi2 {
  rpc Fence(FenceRequest) returns (FenceReply);
  rpc Abort(AbortRequest) returns (AbortReply);
}
