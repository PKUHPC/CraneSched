name: Build, Test and Publish

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Product branch, tag or commit (blank uses this workflow commit)
        required: false
        type: string
      harness_ref:
        description: Integration suite branch, tag or commit (blank uses master)
        required: false
        type: string
      publish_packages:
        description: Upload this build's RPMs to the configured package repository
        required: false
        default: false
        type: boolean
      reuse_build:
        description: Successful workflow run ID/attempt whose checked RPMs should be reused (blank builds anew)
        required: false
        type: string
      integration_shards:
        description: Independent integration environments
        type: choice
        default: '4'
        options: ['1', '4']
      integration_tests:
        description: Integration selection
        type: choice
        default: representative
        options: [representative, full]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  format:
    name: C++ Clang Format
    if: ${{ inputs.reuse_build == '' }}
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    # LLVM 20 apt packages are available for Noble, not Ubuntu 26.04.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout the selected product source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record the selected product revision
        id: source
        run: echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Clang-Format 20
        run: |
          set -euo pipefail
          sudo apt-get install -y wget lsb-release
          sudo wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 20
          sudo apt update
          sudo apt-get install -y clang-format-20
          clang-format-20 --version

      - name: Check clang-format and prepare patch
        id: format
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' -t cpp_files < <(
            find src test -type f \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \
              -o -name '*.h' -o -name '*.hh' -o -name '*.hpp' -o -name '*.hxx' \) -print0
          )
          mapfile -d '' -t proto_files < <(
            find protos -type f -name '*.proto' -print0
          )

          cpp_check_status=0
          proto_check_status=0
          if ((${#cpp_files[@]})); then
            if clang-format-20 --dry-run --Werror --style=file "${cpp_files[@]}"; then
              cpp_check_status=0
            else
              cpp_check_status=$?
            fi
          fi
          if ((${#proto_files[@]})); then
            if clang-format-20 --dry-run --Werror --style=file:.clang-format-proto \
              "${proto_files[@]}"; then
              proto_check_status=0
            else
              proto_check_status=$?
            fi
          fi

          if ((cpp_check_status == 0 && proto_check_status == 0)); then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'All files are formatted.'
            exit 0
          fi

          cpp_format_status=0
          proto_format_status=0
          if ((cpp_check_status != 0 && ${#cpp_files[@]})); then
            if clang-format-20 -i --style=file "${cpp_files[@]}"; then
              cpp_format_status=0
            else
              cpp_format_status=$?
            fi
          fi
          if ((proto_check_status != 0 && ${#proto_files[@]})); then
            if clang-format-20 -i --style=file:.clang-format-proto "${proto_files[@]}"; then
              proto_format_status=0
            else
              proto_format_status=$?
            fi
          fi

          if ((cpp_format_status != 0 || proto_format_status != 0)); then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo '::error::clang-format could not produce a formatting patch.'
            exit 1
          fi

          if git diff --quiet -- src test protos; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo '::error::clang-format reported an error without changing source files.'
            exit 1
          fi

          git diff --binary -- src test protos > format.patch
          if [[ ! -s format.patch ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo '::error::clang-format produced an empty patch.'
            exit 1
          fi

          echo 'changed=true' >> "$GITHUB_OUTPUT"
          {
            echo '### Clang format check failed'
            echo
            echo 'The checkout was not modified remotely. Download `format-diff` and run:'
            echo
            echo '```bash'
            echo 'git apply format.patch'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload format patch
        if: always() && steps.format.outputs.changed == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: format-diff
          path: format.patch
          if-no-files-found: error
          retention-days: 3

      - name: Fail when formatting is required
        if: always() && (steps.format.outputs.changed == 'true' || steps.format.outcome == 'failure')
        env:
          FORMAT_CHANGED: ${{ steps.format.outputs.changed }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
        run: |
          if [[ "$FORMAT_CHANGED" == 'true' ]]; then
            echo 'Formatting changes are required; see the format-diff artifact.'
          else
            echo "clang-format check failed before a patch could be prepared (outcome: $FORMAT_OUTCOME)."
          fi
          exit 1

  build:
    name: Go checks, tests and RPM build
    needs: format
    if: ${{ !cancelled() && (needs.format.result == 'success' || inputs.reuse_build != '') }}
    permissions:
      contents: read
      actions: read
    runs-on: crane-build
    timeout-minutes: 120
    container:
      image: ${{ vars.CRANE_CI_BASE_IMAGE }}
    outputs:
      source_sha: ${{ steps.build.outputs.source_sha || steps.reuse.outputs.source_sha }}
      artifact_dir: ${{ steps.build.outputs.artifact_dir || steps.reuse.outputs.artifact_dir }}
      manifest_sha256: ${{ steps.build.outputs.manifest_sha256 || steps.reuse.outputs.manifest_sha256 }}
    env:
      BASE_IMAGE: ${{ vars.CRANE_CI_BASE_IMAGE }}
      GOPROXY: ${{ vars.CRANE_CI_GOPROXY || 'https://goproxy.cn,direct' }}
      GOWORK: 'off'
    steps:
      - name: Checkout the selected product source
        if: ${{ inputs.reuse_build == '' }}
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.format.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Test and package with a persistent build tree
        id: build
        if: ${{ inputs.reuse_build == '' }}
        run: |
          set -euo pipefail
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          [[ "$BASE_IMAGE" =~ @sha256:[a-f0-9]{64}$ ]]
          [[ "$(id -u)" == 1001 && "$(id -g)" == 1001 ]]
          getent passwd 1001 >/dev/null
          getent group 1001 >/dev/null
          source_sha="$(git rev-parse HEAD)"
          source_checkout="$PWD"
          state="/ci/workspaces/native-rhel10-amd64/${BASE_IMAGE##*@sha256:}/ci-debug"
          artifact_dir="/ci/attempts/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/build"
          mkdir -p "$state" "$(dirname "$artifact_dir")"
          mkdir "$artifact_dir"
          exec 9>"$state/build.lock"
          flock 9
          if [[ ! -d "$state/source/.git" ]]; then
            git init "$state/source"
          fi
          git -C "$state/source" config remote.origin.url "$(git -C "$source_checkout" remote get-url origin)"
          git -C "$state/source" fetch --no-tags --update-shallow "$source_checkout" "$source_sha"
          git -C "$state/source" checkout --force --detach "$source_sha"
          cd -P "$state/source"
          [[ "$(git rev-parse HEAD)" == "$source_sha" ]]
          [[ -z "$(git status --porcelain --untracked-files=no)" ]]
          export SOURCE_SHA="$source_sha" ARTIFACT_DIR="$artifact_dir"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export CPM_SOURCE_CACHE=/ci/cache/cpm
          mkdir -p "$CPM_SOURCE_CACHE" "$CCACHE_DIR" "$CCACHE_TEMPDIR"
          # Check Go sources before tests or packaging.
          unformatted="$(gofmt -l go)"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            echo '::error::Run gofmt on the listed files.'
            exit 1
          fi
          make -C go protos
          (cd go && go vet -mod=readonly ./...)
          cmake --preset ci-debug
          cmake --build --preset ci-debug --target crane_unit_tests --parallel "${BUILD_JOBS:-6}"
          ctest --test-dir cmake-build-ci-debug --output-on-failure
          make -C go test
          cmake --build --preset ci-debug --parallel "${BUILD_JOBS:-6}"
          make -C go all tool PREFIX=/usr STRIP=true CHECK_GPU=0
          mkdir -p "$artifact_dir/packages/rpm" "$artifact_dir/cpack-backend"
          (cd cmake-build-ci-debug && cpack -G RPM -B "$artifact_dir/cpack-backend")
          mapfile -t backend_rpms < <(
            find "$artifact_dir/cpack-backend" -maxdepth 1 -type f -name '*.rpm' -print
          )
          [[ "${#backend_rpms[@]}" == 2 ]]
          cp "${backend_rpms[@]}" "$artifact_dir/packages/rpm/"
          GITHUB_TOKEN='${{ github.token }}' make -C go package SKIP_REBUILD=true CHECK_GPU=0 \
            GORELEASER_SNAPSHOT=false GORELEASER_RELEASE_ARGS=--skip=publish,validate
          cp go/build/dist/*.rpm "$artifact_dir/packages/rpm/"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ['ARTIFACT_DIR'])
          expected = {'cranesched-cranectld', 'cranesched-craned', 'cranesched-client',
                      'cranesched-plugin', 'cranesched-slurm-compat'}
          packages = []
          for path in sorted((root / 'packages/rpm').glob('*.rpm')):
              name, version, architecture = subprocess.check_output(
                  ['rpm', '-qp', '--qf', '%{NAME}\t%{VERSION}\t%{ARCH}', str(path)], text=True
              ).split('\t')
              if architecture != 'x86_64':
                  raise SystemExit('Unexpected RPM architecture')
              packages.append({'path': str(path.relative_to(root)), 'name': name,
                               'version': version, 'architecture': architecture,
                               'sha256': hashlib.file_digest(path.open('rb'), 'sha256').hexdigest()})
          if len(packages) != 5 or {item['name'] for item in packages} != expected:
              raise SystemExit('The expected five RPMs were not produced')
          if {item['version'] for item in packages} != {Path('VERSION').read_text().strip()}:
              raise SystemExit('RPM versions do not match the selected product source')
          manifest = {'schema': 1, 'sourceRevision': os.environ['SOURCE_SHA'],
                      'baseImage': os.environ['BASE_IMAGE'], 'target': 'rhel10-amd64',
                      'preset': 'ci-debug', 'nativeTestsPassed': True, 'packages': packages}
          data = (json.dumps(manifest, indent=2) + '\n').encode()
          (root / 'manifest.json').write_bytes(data)
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f"source_sha={manifest['sourceRevision']}\nartifact_dir={root}\n")
              output.write(f"manifest_sha256={hashlib.sha256(data).hexdigest()}\n")
          print('Tests and the five RPMs completed successfully.')
          PY

      - name: Verify and reuse an already successful build
        if: ${{ inputs.reuse_build != '' }}
        id: reuse
        env:
          REUSE_BUILD: ${{ inputs.reuse_build }}
          SOURCE_REF: ${{ inputs.source_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import urllib.request

          if os.environ['SOURCE_REF']:
              raise SystemExit('source_ref must be blank when reusing a build.')
          identity = os.environ['REUSE_BUILD']
          if not re.fullmatch(r'[1-9][0-9]*/[1-9][0-9]*', identity):
              raise SystemExit('reuse_build must be a workflow run ID/attempt.')
          run_id, attempt = identity.split('/')
          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}/attempts/{attempt}",
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              run = json.load(response)
          if run['status'] != 'completed' or run['conclusion'] != 'success':
              raise SystemExit('Only a successful completed workflow attempt can be reused.')
          root = Path('/ci/attempts') / f'{run_id}-{attempt}' / 'build'
          data = (root / 'manifest.json').read_bytes()
          manifest = json.loads(data)
          if (manifest.get('schema') != 1 or manifest.get('nativeTestsPassed') is not True
                  or manifest.get('baseImage') != os.environ['BASE_IMAGE']
                  or manifest.get('target') != 'rhel10-amd64' or manifest.get('preset') != 'ci-debug'
                  or not re.fullmatch('[a-f0-9]{40}', manifest.get('sourceRevision', ''))):
              raise SystemExit('The accepted build has incompatible provenance.')
          expected = {'cranesched-cranectld', 'cranesched-craned', 'cranesched-client',
                      'cranesched-plugin', 'cranesched-slurm-compat'}
          packages = manifest.get('packages', [])
          if len(packages) != 5 or {package['name'] for package in packages} != expected:
              raise SystemExit('Expected exactly the five final RPMs.')
          for package in packages:
              path = (root / package['path']).resolve()
              if not path.is_relative_to(root.resolve() / 'packages') or package['architecture'] != 'x86_64':
                  raise SystemExit('Invalid accepted RPM path or architecture.')
              with path.open('rb') as stream:
                  if hashlib.file_digest(stream, 'sha256').hexdigest() != package['sha256']:
                      raise SystemExit('An accepted RPM changed after its original build.')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f"source_sha={manifest['sourceRevision']}\nartifact_dir={root}\n")
              output.write(f"manifest_sha256={hashlib.sha256(data).hexdigest()}\n")
          print(f"Reusing successful build {identity}, source {manifest['sourceRevision']}; no rebuild performed.")
          PY

  integration:
    name: Assemble and test the same RPMs
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: crane-ci
    timeout-minutes: 180
    concurrency:
      group: crane-ci-integration
      cancel-in-progress: false
      queue: max
    container:
      image: ${{ vars.CRANE_CI_TOOLS_IMAGE }}
    outputs:
      complete: ${{ steps.integration.outputs.complete }}
      expected: ${{ steps.integration.outputs.expected }}
      passed: ${{ steps.integration.outputs.passed }}
    env:
      CI_ARTIFACT_DIR: ${{ needs.build.outputs.artifact_dir }}
      CI_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
      CI_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
      CI_TEST_REF: ${{ inputs.harness_ref || 'master' }}
      CI_ENTRYPOINT: ${{ vars.CRANE_CI_INTEGRATION_ENTRYPOINT }}
      CI_ENTRYPOINT_SHA256: ${{ vars.CRANE_CI_INTEGRATION_SHA256 }}
      CI_SHARD_COUNT: ${{ inputs.integration_shards }}
      CI_TEST_MODE: ${{ inputs.integration_tests }}
    steps:
      - name: Prepare the test inputs, run tests and reclaim their environments
        id: integration
        run: |
          set -euo pipefail
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          [[ "$CI_ENTRYPOINT" == /ci/assets/* ]]
          [[ "$CI_ENTRYPOINT_SHA256" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$CI_ENTRYPOINT_SHA256" "$CI_ENTRYPOINT" | sha256sum --check --status
          python3 "$CI_ENTRYPOINT"

  publish:
    name: Publish this build's RPMs
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && inputs.publish_packages }}
    concurrency:
      group: crane-ci-publish-master-rhel10-amd64
      cancel-in-progress: false
      queue: max
    runs-on: crane-ci
    timeout-minutes: 20
    container:
      image: ${{ vars.CRANE_CI_TOOLS_IMAGE }}
    env:
      CI_ARTIFACT_DIR: ${{ needs.build.outputs.artifact_dir }}
      CI_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
      NEXUS_URL: ${{ secrets.CCREPO_URL }}
      NEXUS_USERNAME: ${{ secrets.CCREPO_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.CCREPO_PASSWORD }}
      UPLOAD_MODE: RPM
      RPM_REPO_NAME: crane
      RPM_ARCH: x86_64
      RPM_DISTRO: '10'
      VERSION: master
      CONTINUE_ON_ERROR: 'true'
    steps:
      - name: Checkout the uploader from the built revision
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          persist-credentials: false
          sparse-checkout: .github/ci

      - name: Verify and upload the build output
        run: |
          set -euo pipefail
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          [[ -n "$NEXUS_URL" && -n "$NEXUS_USERNAME" && -n "$NEXUS_PASSWORD" ]]
          export PACKAGE_DIR="/ci/attempts/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/publish-rpm"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path(os.environ['CI_ARTIFACT_DIR'])
          data = (root / 'manifest.json').read_bytes()
          if hashlib.sha256(data).hexdigest() != os.environ['CI_MANIFEST_SHA256']:
              raise SystemExit('Build manifest checksum mismatch')
          manifest = json.loads(data)
          if not manifest.get('nativeTestsPassed') or len(manifest['packages']) != 5:
              raise SystemExit('Build output is incomplete')
          selected = Path(os.environ['PACKAGE_DIR'])
          selected.mkdir(parents=True, exist_ok=False)
          for package in manifest['packages']:
              path = (root / package['path']).resolve()
              if not path.is_relative_to(root.resolve() / 'packages'):
                  raise SystemExit('RPM path is outside this build output')
              if hashlib.file_digest(path.open('rb'), 'sha256').hexdigest() != package['sha256']:
                  raise SystemExit('RPM checksum mismatch')
              shutil.copyfile(path, selected / path.name)
          PY
          bash .github/ci/upload-packages.sh

  summary:
    name: CI result
    needs: [format, build, integration, publish]
    if: ${{ always() }}
    runs-on: crane-ci
    timeout-minutes: 5
    container:
      image: ${{ vars.CRANE_CI_TOOLS_IMAGE }}
    env:
      JOB_RESULTS: ${{ toJSON(needs) }}
      PUBLISH_REQUESTED: ${{ inputs.publish_packages }}
      BUILD_REUSED: ${{ inputs.reuse_build != '' }}
    steps:
      - name: Report and enforce the required results
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          jobs = json.loads(os.environ['JOB_RESULTS'])
          integration = jobs['integration'].get('outputs', {})
          upload = os.environ['PUBLISH_REQUESTED'] == 'true'
          reused = os.environ.get('BUILD_REUSED') == 'true'
          complete = integration.get('complete') == 'true'
          expected = int(integration.get('expected') or '0')
          passed = int(integration.get('passed') or '0')
          success = (jobs['format']['result'] == ('skipped' if reused else 'success')
                     and jobs['build']['result'] == 'success'
                     and jobs['integration']['result'] == 'success'
                     and complete and expected > 0 and passed == expected
                     and jobs['publish']['result'] == ('success' if upload else 'skipped'))
          lines = ['### Build, Test and Publish', '',
                   f"- C++ formatting: {jobs['format']['result']} (reused checked build: {str(reused).lower()})",
                   f"- Build: {jobs['build']['result']}",
                   f"- Integration: {jobs['integration']['result']} ({passed}/{expected})",
                   f"- Package upload: {jobs['publish']['result']} (requested: {str(upload).lower()})"]
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write('\n'.join(lines) + '\n')
          if not success:
              raise SystemExit('A required phase failed, was cancelled, skipped or incomplete.')
          print('All requested CI phases completed successfully.')
          PY
