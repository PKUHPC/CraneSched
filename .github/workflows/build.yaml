name: CraneTestKit K3s CI

on:
  schedule:
    - cron: "0 22 * * *"
  push:
    branches:
      - master
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - master
    paths:
      - '.github/actionlint.yaml'
      - '.github/workflows/**'
      - '.github/ci/**'
      - 'dependencies/**'
      - 'CMakeModule/**'
      - 'protos/**'
      - 'src/**'
      - 'test/**'
      - 'etc/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'VERSION'
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Backend ref to resolve to an exact commit
        required: false
        default: master
      frontend_ref:
        description: FrontEnd ref to resolve to an exact commit
        required: false
        default: master

permissions: {}

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'pull_request_target'
      && format('pr-{0}', github.event.pull_request.number)
      || github.event_name == 'workflow_dispatch'
      && format('manual-{0}', github.run_id)
      || github.ref
    }}
  cancel-in-progress: true

jobs:
  authorize:
    name: Authorize trusted test dispatch
    if: github.event_name != 'pull_request_target' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      authorized: ${{ steps.authorize.outputs.authorized }}
      backend_sha: ${{ steps.authorize.outputs.backend_sha }}
      frontend_ref: ${{ steps.authorize.outputs.frontend_ref }}
      frontend_sha: ${{ steps.authorize.outputs.frontend_sha }}
      workflow_sha: ${{ steps.authorize.outputs.workflow_sha }}
    steps:
      - name: Checkout trusted authorization policy
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          path: trusted-ci
          sparse-checkout: .github/ci
          persist-credentials: false
          clean: true
          set-safe-directory: false

      - name: Authorize actor and resolve immutable revisions
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          MANUAL_BACKEND_REF: ${{ inputs.backend_ref || 'master' }}
          MANUAL_FRONTEND_REF: ${{ inputs.frontend_ref || 'master' }}
          FRONTEND_REPOSITORY: PKUHPC/CraneSched-FrontEnd
        run: /usr/bin/python3 -I trusted-ci/.github/ci/authorize.py

  test:
    name: test
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: [self-hosted, cranesystemtest]
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONPATH: ""
      CRANETESTKIT_RELEASE_DIR: ${{ vars.CRANETESTKIT_RELEASE_DIR }}
      CRANETESTKIT_AUTOTEST_SHA: ${{ vars.CRANETESTKIT_AUTOTEST_SHA }}
      CRANETESTKIT_EXECUTABLE_SHA256: ${{ vars.CRANETESTKIT_EXECUTABLE_SHA256 }}
      CRANETESTKIT_PROFILE_PATH: ${{ vars.CRANETESTKIT_PROFILE_PATH }}
      CRANETESTKIT_PROFILE_SHA256: ${{ vars.CRANETESTKIT_PROFILE_SHA256 }}
      CRANETESTKIT_BUNDLE_ID: ${{ vars.CRANETESTKIT_BUNDLE_ID }}
      CRANETESTKIT_IMAGE_RUNTIME_SHA256: ${{ vars.CRANETESTKIT_IMAGE_RUNTIME_SHA256 }}
      EXPECTED_CRANE_TESTKIT_K3S_EXECUTABLE: ${{ vars.CRANETESTKIT_K3S_EXECUTABLE }}
      EXPECTED_KUBECONFIG: ${{ vars.CRANETESTKIT_KUBECONFIG }}
      CRANETESTKIT_NFS_ROOT: ${{ vars.CRANETESTKIT_NFS_ROOT }}
      CRANETESTKIT_CACHE_ROOT: /opt/crane-testkit/cache
      CRANETESTKIT_CCACHE_DIR: ${{ vars.CRANETESTKIT_CCACHE_DIR }}
      CRANETESTKIT_FETCHCONTENT_DIR: ${{ vars.CRANETESTKIT_FETCHCONTENT_DIR }}
      BACKEND_SHA: ${{ needs.authorize.outputs.backend_sha }}
      FRONTEND_SHA: ${{ needs.authorize.outputs.frontend_sha }}
      FRONTEND_REF: ${{ needs.authorize.outputs.frontend_ref }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout trusted CI controls
        id: trusted-controls
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.authorize.outputs.workflow_sha }}
          path: trusted-ci
          sparse-checkout: .github/ci
          persist-credentials: false
          clean: true
          set-safe-directory: false

      - name: Validate trusted control revision
        id: verify-controls
        run: |
          set -euo pipefail
          actual="$(git -C trusted-ci rev-parse HEAD)"
          if [[ "$actual" != "${{ needs.authorize.outputs.workflow_sha }}" ]]; then
            echo "Trusted CI control checkout resolved to an unexpected commit." >&2
            exit 2
          fi

      - name: Validate deployment variables
        env:
          EXPECTED_RUNNER_NAME: ${{ runner.name }}
        run: |
          set -euo pipefail
          required=(
            CRANETESTKIT_RELEASE_DIR
            CRANETESTKIT_AUTOTEST_SHA
            CRANETESTKIT_EXECUTABLE_SHA256
            CRANETESTKIT_PROFILE_PATH
            CRANETESTKIT_PROFILE_SHA256
            CRANETESTKIT_BUNDLE_ID
            CRANETESTKIT_IMAGE_RUNTIME_SHA256
            ACTIONS_RUNNER_HOOK_JOB_STARTED
            ACTIONS_RUNNER_HOOK_JOB_COMPLETED
            CRANE_TESTKIT_HOOK_STATE_DIR
            CRANE_TESTKIT_RELEASE_ROOT
            CRANE_TESTKIT_PROFILE
            CRANE_TESTKIT_K3S_EXECUTABLE
            KUBECONFIG
            EXPECTED_CRANE_TESTKIT_K3S_EXECUTABLE
            EXPECTED_KUBECONFIG
            CRANETESTKIT_NFS_ROOT
            CRANETESTKIT_CACHE_ROOT
            CRANETESTKIT_CCACHE_DIR
            CRANETESTKIT_FETCHCONTENT_DIR
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required repository variable is empty: $name" >&2
              exit 2
            fi
          done
          if [[ "$(hostname -s)" != "cranesystemtest" ]]; then
            echo "Privileged job was routed to an unexpected host." >&2
            exit 2
          fi
          if [[ "$EXPECTED_RUNNER_NAME" != "cranesystemtest" || "$(id -u)" != "0" ]]; then
            echo "Privileged job was routed to an unexpected runner service identity." >&2
            exit 2
          fi
          expected_started="${CRANETESTKIT_RELEASE_DIR}/github-runner/action_job_started.sh"
          expected_completed="${CRANETESTKIT_RELEASE_DIR}/github-runner/action_job_completed.sh"
          [[ "$ACTIONS_RUNNER_HOOK_JOB_STARTED" == "$expected_started" ]]
          [[ "$ACTIONS_RUNNER_HOOK_JOB_COMPLETED" == "$expected_completed" ]]
          [[ "$CRANE_TESTKIT_HOOK_STATE_DIR" == "/run/crane-testkit-runner" ]]
          [[ "$CRANE_TESTKIT_RELEASE_ROOT" == "$CRANETESTKIT_RELEASE_DIR" ]]
          [[ "$CRANE_TESTKIT_PROFILE" == "$CRANETESTKIT_PROFILE_PATH" ]]
          [[ "$CRANE_TESTKIT_K3S_EXECUTABLE" == "$EXPECTED_CRANE_TESTKIT_K3S_EXECUTABLE" ]]
          [[ "$KUBECONFIG" == "$EXPECTED_KUBECONFIG" ]]
          [[ -x "$expected_started" && -x "$expected_completed" ]]
          [[ -d "$CRANE_TESTKIT_HOOK_STATE_DIR" && ! -L "$CRANE_TESTKIT_HOOK_STATE_DIR" ]]
          run_id="gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          marker="${CRANE_TESTKIT_HOOK_STATE_DIR}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.run-id"
          [[ -f "$marker" && ! -L "$marker" ]]
          [[ "$(stat -c %u "$marker")" == "0" && "$(stat -c %a "$marker")" == "600" ]]
          cmp -s <(printf '%s\n' "$run_id") "$marker"
          while IFS= read -r variable_name; do
            case "$variable_name" in
              *CI_AGENT*|*FAILURE_ANALYSIS*)
                echo "Legacy failure-analysis environment is still active." >&2
                exit 2
                ;;
            esac
          done < <(compgen -e)

      - name: Validate CraneTestKit release and Kubernetes boundary
        run: |
          set -euo pipefail
          runtime_manifest="${CRANETESTKIT_NFS_ROOT}/images/${CRANETESTKIT_BUNDLE_ID}/runtime.json"
          /usr/bin/python3 -I trusted-ci/.github/ci/validate-cranetestkit-runner.py \
            --release "$CRANETESTKIT_RELEASE_DIR" \
            --autotest-sha "$CRANETESTKIT_AUTOTEST_SHA" \
            --executable-sha256 "$CRANETESTKIT_EXECUTABLE_SHA256" \
            --profile "$CRANETESTKIT_PROFILE_PATH" \
            --profile-sha256 "$CRANETESTKIT_PROFILE_SHA256" \
            --bundle-id "$CRANETESTKIT_BUNDLE_ID" \
            --runtime-manifest "$runtime_manifest" \
            --runtime-sha256 "$CRANETESTKIT_IMAGE_RUNTIME_SHA256" \
            --k3s "$CRANE_TESTKIT_K3S_EXECUTABLE" \
            --kubeconfig "$KUBECONFIG" \
            --nfs-root "$CRANETESTKIT_NFS_ROOT"
          {
            echo "CRANETESTKIT_EXECUTABLE=${CRANETESTKIT_RELEASE_DIR}/.venv/bin/crane_testkit"
            echo "CRANETESTKIT_IMAGE_RUNTIME=${runtime_manifest}"
            echo "CRANETESTKIT_RUN_ID=gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "CRANETESTKIT_RUN_ROOT=${CRANETESTKIT_NFS_ROOT}/runs/gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_ENV"

      - name: Checkout exact Backend revision
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.authorize.outputs.backend_sha }}
          path: sources/CraneSched
          persist-credentials: false
          clean: true
          set-safe-directory: false

      - name: Checkout exact FrontEnd revision
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: PKUHPC/CraneSched-FrontEnd
          ref: ${{ needs.authorize.outputs.frontend_sha }}
          path: sources/CraneSched-FrontEnd
          persist-credentials: false
          clean: true
          set-safe-directory: false

      - name: Verify source revisions and local build cache
        run: |
          set -euo pipefail
          backend_actual="$(git -C sources/CraneSched rev-parse HEAD)"
          frontend_actual="$(git -C sources/CraneSched-FrontEnd rev-parse HEAD)"
          [[ "$backend_actual" == "$BACKEND_SHA" ]]
          [[ "$frontend_actual" == "$FRONTEND_SHA" ]]
          [[ -z "$(git -C sources/CraneSched status --porcelain=v1 --untracked-files=all)" ]]
          [[ -z "$(git -C sources/CraneSched-FrontEnd status --porcelain=v1 --untracked-files=all)" ]]
          mkdir -p "$CRANETESTKIT_CCACHE_DIR" "$CRANETESTKIT_FETCHCONTENT_DIR"
          cache_root_real="$(realpath "$CRANETESTKIT_CACHE_ROOT")"
          ccache_real="$(realpath "$CRANETESTKIT_CCACHE_DIR")"
          fetchcontent_real="$(realpath "$CRANETESTKIT_FETCHCONTENT_DIR")"
          nfs_real="$(realpath "$CRANETESTKIT_NFS_ROOT")"
          [[ "$cache_root_real" == "/opt/crane-testkit/cache" ]]
          [[ "$ccache_real" == "$cache_root_real/ccache" ]]
          [[ "$fetchcontent_real" == "$cache_root_real/fetchcontent" ]]
          [[ -f "$cache_root_real/.maintenance.lock" && ! -L "$cache_root_real/.maintenance.lock" ]]
          for cache_path in "$ccache_real" "$fetchcontent_real"; do
            if [[ "$cache_path" != "$cache_root_real/"* ]]; then
              echo "Build dependency cache is outside the coordinated cache root." >&2
              exit 2
            fi
            if [[ "$cache_path" == "$nfs_real" || "$cache_path" == "$nfs_real/"* ]]; then
              echo "Build dependency caches must stay on the cranesystemtest local SSD." >&2
              exit 2
            fi
            case "$(stat -f -c %T "$cache_path")" in
              nfs*|fuse*)
                echo "Build dependency cache is not on a local filesystem: $cache_path" >&2
                exit 2
                ;;
            esac
          done

      - name: Build and publish exact packages
        id: build
        run: |
          set -euo pipefail
          build_output="$RUNNER_TEMP/crane-build-output"
          build_log="$RUNNER_TEMP/crane-build.jsonl"
          mkdir -p "$build_output"
          exec {maintenance_lock_fd}<"$CRANETESTKIT_CACHE_ROOT/.maintenance.lock"
          /usr/bin/flock --shared "$maintenance_lock_fd"
          set -o pipefail
          "$CRANETESTKIT_EXECUTABLE" env build \
            --backend "$GITHUB_WORKSPACE/sources/CraneSched" \
            --frontend "$GITHUB_WORKSPACE/sources/CraneSched-FrontEnd" \
            --output "$build_output" \
            --preset ci-debug \
            --ccache-dir "$CRANETESTKIT_CCACHE_DIR" \
            --fetchcontent-dir "$CRANETESTKIT_FETCHCONTENT_DIR" \
            --publish-root "$CRANETESTKIT_NFS_ROOT" \
            | tee "$build_log"
          build_json="$(tail -n 1 "$build_log")"
          build_manifest="$(jq -er '.manifest' <<<"$build_json")"
          build_id="$(jq -er '.build_id' <<<"$build_json")"
          cache_hit="$(
            jq -er '
              .cache_hit
              | if type == "boolean" then tostring
                else error("cache_hit must be a boolean")
                end
            ' <<<"$build_json"
          )"
          [[ "$build_manifest" == "$CRANETESTKIT_NFS_ROOT/builds/"*"/manifest.json" ]]
          [[ -f "$build_manifest" && ! -L "$build_manifest" ]]
          {
            echo "build_manifest=$build_manifest"
            echo "build_id=$build_id"
            echo "cache_hit=$cache_hit"
          } >> "$GITHUB_OUTPUT"

      - name: Execute sharded system tests
        id: execute
        env:
          BUILD_MANIFEST: ${{ steps.build.outputs.build_manifest }}
        run: |
          set -uo pipefail
          "$CRANETESTKIT_EXECUTABLE" system execute \
            --profile "$CRANETESTKIT_PROFILE_PATH" \
            --run-id "$CRANETESTKIT_RUN_ID" \
            --config "${CRANETESTKIT_RELEASE_DIR}/config/config.yaml" \
            --build-manifest "$BUILD_MANIFEST" \
            --image-runtime "$CRANETESTKIT_IMAGE_RUNTIME"
          exit_code=$?
          if [[ "$exit_code" != 0 && "$exit_code" != 1 && "$exit_code" != 2 ]]; then
            echo "CraneTestKit returned an unsupported exit code: $exit_code" >&2
            exit_code=2
          fi
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Collect sanitized CI artifacts
        id: collect-artifacts
        if: always() && steps.verify-controls.outcome == 'success'
        env:
          EXECUTE_EXIT_CODE: ${{ steps.execute.outputs.exit_code }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/crane-testkit-artifacts"
          arguments=(
            --run-root "${CRANETESTKIT_RUN_ROOT:-$CRANETESTKIT_NFS_ROOT/runs/gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
            --destination "$artifact_dir"
            --run-id "${CRANETESTKIT_RUN_ID:-gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          )
          if [[ "$EXECUTE_EXIT_CODE" != "0" ]]; then
            arguments+=(--include-logs)
          fi
          /usr/bin/python3 -I trusted-ci/.github/ci/collect-cranetestkit-artifacts.py "${arguments[@]}"
          echo "artifact_dir=$artifact_dir" >> "$GITHUB_OUTPUT"

      - name: Publish job summary
        if: always() && steps.collect-artifacts.outcome == 'success'
        run: cat "${{ steps.collect-artifacts.outputs.artifact_dir }}/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized run evidence
        if: always() && steps.collect-artifacts.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: crane-testkit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.collect-artifacts.outputs.artifact_dir }}
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false

      - name: Enforce CraneTestKit exit contract
        if: always()
        env:
          EXECUTE_EXIT_CODE: ${{ steps.execute.outputs.exit_code }}
        run: |
          case "$EXECUTE_EXIT_CODE" in
            0) exit 0 ;;
            1) echo "System tests completed with test failures." >&2; exit 1 ;;
            2) echo "System tests ended with an infrastructure error." >&2; exit 2 ;;
            *) echo "System tests did not produce a valid aggregate exit code." >&2; exit 2 ;;
          esac
